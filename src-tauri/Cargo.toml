[package]
name = "gatedkey"
version = "0.1.1"
description = "Remap any key on your keyboard to launch anything."
authors = ["yzgershon"]
license = "MIT"
repository = "https://github.com/yzgershon/GatedKey"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gatedkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# A key remapper has no business being large. These take the binary down hard.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
